<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Simple Timer by Rishi</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <h1>A Simple Timer by Rishi</h1>
    <p>
        Hello! This is just a simple timer, created by me to explore more ideas!
        <br>
        You can choose amongst these presets, or set one of your own!
    </p>
    <nav>
        <ul>
            <button id="5-minutes" onclick="timer(5)">5 minutes</button>
            <output id="timer"></output>
            <br>
            <button id="10-minutes" onclick="timer(10)">10 minutes</button>
            <br>
            <button id="15-minutes" onclick="timer(15)">15 minutes</button>
            <br>
            <button id="20-minutes" onclick="timer(20)">20 minutes</button>
            <br>
            <button id="25-minutes" onclick="timer(25)">25 minutes</button>
            <br>
            <button id="30-minutes" onclick="timer(30)">30 minutes</button>
            <br>
            <button id="45-minutes" onclick="timer(45)">45 minutes</button>
            <br>
            <button id="1-hour" onclick="timer(60)">1 hour</button>
            <br>
            <button id="custom" onclick="custom()">CUSTOM</button>
        </ul>
    </nav>
</body>
